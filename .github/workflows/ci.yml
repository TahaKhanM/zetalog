name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:release-tooling
      - run: pnpm audit --prod
      - run: pnpm build

  extension-e2e:
    # Real Chromium against the offline Zetamac replica: deterministic and
    # incapable of writing to the live website.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: >-
          pnpm --filter @zetalog/extension exec playwright test
          e2e/extension.spec.ts e2e/link.spec.ts --repeat-each=3

  fullstack:
    # Fresh local Supabase applies every migration, runs pgTAP, and then serves
    # the real web/API routes used by the browser and extension suites. Setting
    # ZL_FULLSTACK=1 makes a skipped full-stack test a CI failure condition.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZL_FULLSTACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.98.2
          github-token: ${{ github.token }}
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start fresh Supabase and apply migrations
        run: supabase start
      - name: Lint database schema
        run: supabase db lint --local --level error
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Run full-stack website authentication and dashboard tests
        run: pnpm --filter @zetalog/web test:e2e
      - name: Run full-stack extension API and browser tests
        run: pnpm --filter @zetalog/extension test:e2e
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  release-artifact:
    # Build once, inspect once, load that exact ZIP in Chromium, then retain the
    # same bytes and checksum. Store submission must download this artifact;
    # nobody may rebuild it manually after approval.
    needs: [verify, extension-e2e, fullstack]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build immutable version 1.0.1 ZIP
        run: pnpm --filter @zetalog/extension zip
      - name: Inspect release ZIP
        run: node scripts/inspect-extension-zip.mjs apps/extension/.output/zetalogextension-1.0.1-chrome.zip
      - name: Extract exact release ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/zetalog-release"
          unzip -q apps/extension/.output/zetalogextension-1.0.1-chrome.zip -d "$RUNNER_TEMP/zetalog-release"
      - name: Browser-test exact release ZIP
        env:
          ZL_EXTENSION_OUTPUT: ${{ runner.temp }}/zetalog-release
        run: >-
          pnpm --filter @zetalog/extension exec playwright test
          e2e/extension.spec.ts --repeat-each=3
      - name: Record release checksum
        run: |
          cd apps/extension/.output
          sha256sum zetalogextension-1.0.1-chrome.zip > zetalogextension-1.0.1-chrome.zip.sha256
      - name: Retain exact tested release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zetalog-extension-1.0.1-${{ github.sha }}
          path: |
            apps/extension/.output/zetalogextension-1.0.1-chrome.zip
            apps/extension/.output/zetalogextension-1.0.1-chrome.zip.sha256
          if-no-files-found: error
          retention-days: 30
